# Every container keeps at most 3 x 10 MB of logs; older entries are overwritten.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  alerts-api:
    logging: *default-logging
    build: .
    container_name: alerts-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_PATH: /data/tenders.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://129.151.181.87:8009}
    ports:
      - "9005:9005"
    volumes:
      - tender-sqlite-data:/data
    networks:
      - tender-net
volumes:
  tender-sqlite-data:
    external: true
    name: tender-scrapping_tender-sqlite-data
networks:
  tender-net:
    external: true
    name: tender-scrapping-net
