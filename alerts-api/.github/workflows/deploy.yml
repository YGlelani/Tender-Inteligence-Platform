name: Deploy Alerts API
on:
  workflow_run:
    workflows: ["Build and Test Alerts API"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alerts-api-production
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: deploy-src
          clean: false
      - name: Create environment file
        working-directory: deploy-src
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$JWT_SECRET" ]; then echo "JWT_SECRET secret is missing"; exit 1; fi
          umask 077
          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" > .env
          printf 'DATABASE_PATH=/data/tenders.db\n' >> .env
          printf 'ALERT_SCAN_INTERVAL_SECONDS=300\n' >> .env
      - name: Build and deploy
        working-directory: deploy-src
        run: docker compose up -d --build --force-recreate
      - name: Verify health
        working-directory: deploy-src
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:9005/health; then exit 0; fi
            sleep 5
          done
          docker logs --tail 120 alerts-api
          exit 1
