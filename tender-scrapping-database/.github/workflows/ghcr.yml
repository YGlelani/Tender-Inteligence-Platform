name: Build and Push Scraper API

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ghcr.yml'
      - 'scraper-api/**'
      - 'db/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/tender-scraper-api
          # The Dockerfile COPY paths are repository-root-relative, so the build context must be the repository root.
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" -f scraper-api/Dockerfile .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
