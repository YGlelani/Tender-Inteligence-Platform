name: tender-frontend

services:
  frontend:
    image: tender-frontend:latest
    container_name: tender-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${USER_SERVER_PORT}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"