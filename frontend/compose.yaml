name: ${COMPOSE_PROJECT_NAME:-tender-dev}-web

services:
  frontend:
    image: tender-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${USER_SERVER_PORT:-8008}:80"
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${LOGIN_FRONTEND_PORT:-8009}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
