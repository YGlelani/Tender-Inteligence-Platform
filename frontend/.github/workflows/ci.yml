name: Frontend CI

on:
  push:
    branches:
      - main
      - feature/saved-tender
      - combine
      - fix/theme-layer-dashboard-smoke-tests
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Check required files and shared wiring
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html login.html dashboard.html feed.html tender.html tender-search.html saved-tenders.html
            alerts.html profile.html application-tracker.html Dockerfile compose.yaml
            css/styles.css css/theme.css css/modern-shell.css css/saved-tenders.css
            scripts/smoke-dashboard.mjs scripts/smoke-tender-search.mjs scripts/navigation.js scripts/api.js scripts/alerts.js
            scripts/chart.js scripts/config.js scripts/feed.js scripts/main.js scripts/overview.js
            scripts/profile.js scripts/state.js scripts/tender.js scripts/saved-tenders.js
            scripts/application-tracker.js scripts/tender-search.js scripts/utils.js scripts/shared-utils.js
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done
          if [[ -e scripts/script.js ]]; then
            echo "::error::Unused demo file scripts/script.js must be deleted"
            exit 1
          fi
          for page in dashboard.html feed.html tender.html tender-search.html saved-tenders.html alerts.html profile.html; do
            if ! grep -q 'scripts/navigation.js' "$page"; then
              echo "::error::$page does not load shared navigation"
              exit 1
            fi
          done
          echo "Required files and shared navigation checks passed"

      - name: Smoke test dashboard markup and assets
        run: node scripts/smoke-dashboard.mjs

      - name: Smoke test tender search API wiring
        run: node scripts/smoke-tender-search.mjs

      - name: Smoke test overview matches
        run: node scripts/smoke-match-summary.mjs

      - name: Smoke test read-only company profile
        run: node scripts/smoke-profile.mjs

      - name: Validate JavaScript
        run: |
          for file in scripts/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Build Docker image
        run: |
          docker build --no-cache -t tender-frontend:test .
