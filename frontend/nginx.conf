# Replaces the stock nginx server block (see Dockerfile).

# Error pages and the Server header no longer show the nginx version.
server_tokens off;

# Access log without query strings or referrers. Sign-in tokens no longer travel in
# addresses, but old links still might, and searches (?q=) are the user's business.
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log no_query;

    # Security headers, on every response including errors.
    #
    # Content-Security-Policy:
    # - scripts only from this site, and no inline scripts;
    # - inline styles stay allowed because the pages set widths and colours in style="";
    # - the APIs are on this same host on other ports ($host is the address the visitor used);
    # - blob: lets a signed-in user open their own uploaded document;
    # - no other site may put these pages in a frame.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' $scheme://$host:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Never serve hidden files or folders (.git, .env, ...), even if one ends up in the image.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        # "Cache-Control: no-cache": browsers check with the server before reusing a cached page or
        # script, so a deploy reaches everyone at once (an unchanged file costs a short 304 reply).
        # This is not add_header, so the security headers above still apply here.
        expires -1;
    }
}
