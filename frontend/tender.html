<!DOCTYPE html>
<html lang="en">

<head>
    <!-- One light/dark mode for the whole app; runs before the styles to avoid a flash. -->
    <script src="scripts/runtime-config.js"></script>
    <script src="scripts/theme.js"></script>
<meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Tender Details — Tender Scrapper
    </title>

    <link
        rel="stylesheet"
        href="./css/styles.css">
    <script type="module" src="./scripts/navigation.js"></script>

    <link rel="stylesheet" href="./css/app-theme.css">
    <link rel="stylesheet" href="./css/responsive-fix.css">
</head>


<body>



<aside class="sidebar">

    <div class="logo-area">
        <div class="logo-icon">TS</div>
        <span>Tender Scrapper</span>
    </div>

    <button
        class="mobile-sidebar-close"
        id="mobileSidebarClose"
        type="button"
        aria-label="Close navigation">
        <svg class="lucide lucide-x" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>

    <nav class="sidebar-nav">

        <a
            href="./dashboard.html"
            class="nav-item"
            data-page="overview">
            <span class="nav-icon" aria-hidden="true"><svg class="lucide lucide-house" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
            <span>Overview</span>
        </a>

        <a
            href="./feed.html"
            class="nav-item"
            data-page="feed">
            <span class="nav-icon" aria-hidden="true"><svg class="lucide lucide-newspaper" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></svg></span>
            <span>Tender Feed</span>
        </a>

        <a
            href="./saved-tenders.html" class="nav-item" data-page="saved-tenders"><span class="nav-icon" aria-hidden="true"><svg class="lucide lucide-star" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></span><span>Saved Tenders</span></a>
        

    </nav>

    <div class="sidebar-user">

        <a
            href="./profile.html"
            class="profile-link"
            data-page="profile"
            aria-label="Open your business profile">

            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>

                <div class="user-details">
                    <small>My profile</small>
                    <strong id="currentUser">User</strong>
                </div>

                <span class="profile-link-arrow" aria-hidden="true">›</span>
            </div>

        </a>

        <button
            id="logoutButton"
            class="logout-button"
            type="button">
            <span><svg class="lucide lucide-log-out" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span>
            <span>Logout</span>
        </button>

    </div>

</aside>

<div
    class="sidebar-backdrop"
    id="sidebarBackdrop">
</div>

<button
    class="mobile-menu-button"
    id="mobileSidebarToggle"
    type="button"
    aria-label="Open navigation"><svg class="lucide lucide-menu" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></button>


<main class="main-content">


    <div class="detail-topbar">

        <a
            href="./feed.html"
            class="back-link">

            <svg class="lucide lucide-arrow-left" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to feed

        </a>

    </div>


    <header
        class="detail-header"
        id="detailHeader">

        <h1 class="detail-title">Tender details</h1>
        <p class="state-msg">
            Loading tender…
        </p>

    </header>


    <div
        class="detail-grid"
        id="detailGrid">
    </div>


    <section
        class="detail-section"
        id="detailDocsSection"
        hidden>

        <h2 class="detail-section-title">
            Documents
        </h2>

        <ul
            class="doc-list"
            id="docList">
        </ul>

    </section>


</main>


<script
    type="module"
    src="./scripts/cookies.js">
</script>

<script
    type="module"
    src="./scripts/navigation.js">
</script>

<script
    type="module"
    src="./scripts/tender.js">
</script>


</body>
</html>
