# Every container keeps at most 3 x 10 MB of logs; older entries are overwritten.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: ${COMPOSE_PROJECT_NAME:-tender-dev}-alerts

services:
  alerts-api:
    image: tender-alerts-api:${IMAGE_TAG:-local}
    logging: *default-logging
    build: .
    restart: unless-stopped
    env_file: ["${SERVICE_ENV_FILE:-.env}"]
    environment:
      DATABASE_PATH: /data/tenders.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8009}
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${ALERTS_HOST_PORT:-9005}:9005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9005/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - tender-sqlite-data:/data
    networks:
      - tender-net
volumes:
  tender-sqlite-data:
    external: true
    name: ${TENDER_SQLITE_VOLUME:-tender-dev-tender-sqlite-data}
networks:
  tender-net:
    external: true
    name: ${TENDER_NETWORK_NAME:-tender-dev-net}
