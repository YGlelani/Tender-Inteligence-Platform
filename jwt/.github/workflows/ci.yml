name: Build and Test

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check dependencies for known vulnerabilities

        run: |

          python -m pip install pip-audit==2.10.1

          pip-audit -r requirements.txt


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Create SQLite test database
        run: |
          python - <<'PY'
          import sqlite3, bcrypt
          db = sqlite3.connect("/tmp/tenders.db")
          db.execute("CREATE TABLE users (username TEXT PRIMARY KEY, hashed_password TEXT NOT NULL, is_active INTEGER NOT NULL DEFAULT 1)")
          hashed = bcrypt.hashpw(b"password123", bcrypt.gensalt()).decode()
          db.execute("INSERT INTO users (username, hashed_password, is_active) VALUES (?, ?, 1)", ("musiwalo", hashed))
          db.commit()
          db.close()
          PY

      - name: Run tests
        env:
          DATABASE_PATH: /tmp/tenders.db
          JWT_SECRET: ci-test-secret
          SESSION_TIMEOUT_HOURS: "2"
        run: python -m pytest -q
