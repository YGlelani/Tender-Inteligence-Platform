version: '3.8'

# Every container keeps at most 3 x 10 MB of logs; older entries are overwritten.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jwt-api:
    logging: *default-logging
    build: .
    container_name: jwt-api
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/tenders.db
      NOTIFICATIONS_API_URL: ${NOTIFICATIONS_API_URL:-http://tender-notifications-api:8000}
      # Pages allowed to call this API from the browser (comma-separated).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://129.151.181.87:8009}
    volumes:
      - tender-sqlite-data:/data
    restart: unless-stopped
    networks:
      - tender-net

volumes:
  tender-sqlite-data:
    external: true
    name: tender-scrapping_tender-sqlite-data

networks:
  tender-net:
    external: true
    name: tender-scrapping-net
