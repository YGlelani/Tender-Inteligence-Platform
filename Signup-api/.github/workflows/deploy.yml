name: Deploy Signup API

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: self-hosted
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate required settings
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_CONFIRMATION_URL: ${{ secrets.EMAIL_CONFIRMATION_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in JWT_SECRET EMAIL_CONFIRMATION_URL EMAIL_FROM SMTP_HOST SMTP_USERNAME SMTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
      - name: Create environment file
        env:
          DATABASE_PATH: /data/tenders.db
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_CONFIRMATION_URL: ${{ secrets.EMAIL_CONFIRMATION_URL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          VERIFICATION_TOKEN_EXPIRE_MINUTES: ${{ secrets.VERIFICATION_TOKEN_EXPIRE_MINUTES }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          ACCOUNT_DELETION_KEY: ${{ secrets.ACCOUNT_DELETION_KEY }}
          AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$ACCOUNT_DELETION_KEY" ]; then
            echo "::warning::ACCOUNT_DELETION_KEY is not set, so account deletion will answer 503."
          fi
          {
            printf 'DATABASE_PATH=%s\n' "$DATABASE_PATH"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'EMAIL_CONFIRMATION_URL=%s\n' "$EMAIL_CONFIRMATION_URL"
            printf 'LOGIN_URL=%s\n' "$LOGIN_URL"
            printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
            printf 'SMTP_USERNAME=%s\n' "$SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_USE_TLS=%s\n' "${SMTP_USE_TLS:-true}"
            printf 'VERIFICATION_TOKEN_EXPIRE_MINUTES=%s\n' "${VERIFICATION_TOKEN_EXPIRE_MINUTES:-30}"
            printf 'INTERNAL_API_KEY=%s\n' "$INTERNAL_API_KEY"
            printf 'ACCOUNT_DELETION_KEY=%s\n' "$ACCOUNT_DELETION_KEY"
            printf 'AGENT_API_URL=%s\n' "${AGENT_API_URL:-http://tender-agent-api:9000}"
          } > .env
      - name: Deploy Signup API
        run: docker compose up -d --build
      - name: Wait for API on port 8007
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:8007/health; then
              echo ""
              echo "Signup API is healthy on port 8007!"
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 tender-signup-api
          exit 1
