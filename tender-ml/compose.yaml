name: ${COMPOSE_PROJECT_NAME:-tender-dev}-ml

services:
  tender-ml:
    image: tender-ml:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/tenders.db
      MODEL_PATH: /models/category_model.joblib
      REPORTS_DIR: /models/reports
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${TENDER_ML_HOST_PORT:-9004}:9004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9004/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # The shared database is opened read-only by the code. It is not mounted with :ro
      # because SQLite needs to see the database's WAL files to read it safely.
      - tender-sqlite-data:/data
      - tender-ml-models:/models
    networks:
      - tender-net
volumes:
  tender-sqlite-data:
    external: true
    name: ${TENDER_SQLITE_VOLUME:-tender-dev-tender-sqlite-data}
  tender-ml-models:
networks:
  tender-net:
    external: true
    name: ${TENDER_NETWORK_NAME:-tender-dev-net}
