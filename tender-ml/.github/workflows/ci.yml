name: Build and Test Tender ML

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python
        run: |
          python -m compileall -q tender_ml tests app.py train.py predict.py audit.py compare_models.py

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Build Docker image
        run: |
          docker build --no-cache -t tender-ml:test .
