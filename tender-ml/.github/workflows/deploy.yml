name: Deploy Tender ML
on:
  workflow_run:
    workflows: ["Build and Test Tender ML"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tender-ml-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: deploy-src
          clean: false
      - name: Build image
        working-directory: deploy-src
        run: docker compose build
      - name: Train model
        working-directory: deploy-src
        # Exit code 2 means the saved model scored better and was kept, which is fine.
        run: docker compose run --rm tender-ml python train.py || [ $? -eq 2 ]
      - name: Start service
        working-directory: deploy-src
        run: docker compose up -d --force-recreate
      - name: Verify health
        working-directory: deploy-src
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:9004/health; then exit 0; fi
            sleep 5
          done
          docker logs --tail 120 tender-ml
          exit 1
