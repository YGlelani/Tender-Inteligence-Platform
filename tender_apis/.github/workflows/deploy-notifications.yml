name: Notifications API Deploy

on:
  push:
    branches:
      - Feature/notifications-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Notifications API
    runs-on: self-hosted

    steps:
      - name: Checkout notifications source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test notifications API before deployment
        env:
          ENABLE_SCHEDULER: "false"
        run: |
          set -eu
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          python -m venv "$TEST_DIR/venv"
          "$TEST_DIR/venv/bin/python" -m pip install --upgrade pip
          "$TEST_DIR/venv/bin/python" -m pip install -r requirements.txt pytest
          "$TEST_DIR/venv/bin/python" -m pytest -q

      - name: Create runtime environment file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          PUBLIC_API_URL: ${{ secrets.NOTIFICATIONS_PUBLIC_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          set -eu
          for name in JWT_SECRET INTERNAL_API_KEY; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Repository secret $name is required."
              exit 1
            fi
          done
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$EMAIL_FROM" ]; then
            echo "Warning: SMTP secrets are incomplete; notifications will show in the app but emails will not be sent."
          fi
          umask 077
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_ALGORITHM=%s\n' "${JWT_ALGORITHM:-HS256}"
            printf 'INTERNAL_API_KEY=%s\n' "$INTERNAL_API_KEY"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'PUBLIC_API_URL=%s\n' "$PUBLIC_API_URL"
            printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
            printf 'SMTP_USERNAME=%s\n' "$SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_USE_TLS=%s\n' "${SMTP_USE_TLS:-true}"
          } > .env

      - name: Build and deploy notifications API
        run: docker compose up -d --build --force-recreate

      - name: Verify notifications API health
        run: |
          for attempt in $(seq 1 12); do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:9007/health)"; then
              if printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status") == "healthy" and d.get("service") == "notifications-api" and d.get("database") == "connected" else 1)'; then
                echo "Notifications API is healthy on port 9007."
                exit 0
              fi
              echo "Health endpoint returned a response from the wrong service or an unready database."
            fi
            sleep 5
          done
          docker logs --tail 100 tender-notifications-api || true
          exit 1
