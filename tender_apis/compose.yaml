# Every container keeps at most 3 x 10 MB of logs; older entries are overwritten.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: ${COMPOSE_PROJECT_NAME:-tender-dev}-notifications

services:
  tender-notifications-api:
    image: tender-notifications-api:${IMAGE_TAG:-local}
    logging: *default-logging
    build: .
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${NOTIFICATIONS_HOST_PORT:-9007}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /data/tenders.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8009}
    volumes:
      - tender-sqlite-data:/data
    restart: unless-stopped
    networks:
      - tender-scrapping-net

volumes:
  tender-sqlite-data:
    external: true
    name: ${TENDER_SQLITE_VOLUME:-tender-dev-tender-sqlite-data}

networks:
  tender-scrapping-net:
    external: true
    name: ${TENDER_NETWORK_NAME:-tender-dev-net}
